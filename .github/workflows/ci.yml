name: CI

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bscout
          POSTGRES_USER: bscout
          POSTGRES_PASSWORD: bscout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bscout -d bscout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-test-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create test database
        run: PGPASSWORD=bscout psql -h localhost -U bscout -d bscout -c 'CREATE DATABASE bscout_test'

      - name: Check migrations apply from scratch
        run: python -m alembic upgrade head

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Full suite with coverage
        run: python -m pytest --cov=src --cov-report=term-missing -q

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests
