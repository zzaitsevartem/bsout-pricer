# Виртуальный хост BScout (прод).
# Файл-шаблон: entrypoint nginx прогоняет его через envsubst
# (разрешены только SERVER_NAME, TLS_CERT_PATH, TLS_KEY_PATH, CLIENT_MAX_BODY_SIZE)
# и кладёт результат в /etc/nginx/conf.d/bscout.conf.

upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=30s;
}

upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=30s;
}

# HTTP: ACME-challenge + редирект на HTTPS.
# Единственный сервер на :80, поэтому сюда же попадает и healthcheck
# композа (http://127.0.0.1/healthz) — обрабатывается выше редиректа.
server {
    listen 80;
    server_name ${SERVER_NAME};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: фронт, API с лимитами, healthcheck.
server {
    listen 443 ssl;
    server_name ${SERVER_NAME};

    ssl_certificate ${TLS_CERT_PATH};
    ssl_certificate_key ${TLS_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location ^~ /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_conn conn_zone 32;
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
