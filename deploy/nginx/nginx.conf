# Главный конфиг nginx для прод-развёртывания BScout.
# Монтируется в /etc/nginx/nginx.conf (read-only) сервисом nginx из
# docker-compose.prod.yml и полностью заменяет конфиг из образа.
#
# Виртуальные хосты лежат в bscout.conf — он подключается штатным механизмом
# шаблонов образа nginx: /etc/nginx/templates/bscout.conf.template прогоняется
# через envsubst и кладётся в /etc/nginx/conf.d/bscout.conf.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Не выдавать версию nginx в заголовке Server и на страницах ошибок.
    server_tokens off;

    # $http_x_forwarded_for в логе — то, что прислал клиент (для разбора инцидентов);
    # реальный адрес всегда в $remote_addr.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for" rt=$request_time ut="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout  65s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Тайм-ауты на медленных клиентов (защита от slowloris).
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    # Ограничение размера тела запроса. Аудит отметил его отсутствие: без него
    # любой запрос произвольного объёма доходит до uvicorn и съедает память.
    # Значение по умолчанию задаётся здесь, но реально его переопределяет
    # server-уровень в bscout.conf (переменная CLIENT_MAX_BODY_SIZE).
    client_max_body_size        2m;
    client_body_buffer_size     32k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;

    types_hash_max_size 2048;

    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers         8 16k;
    proxy_busy_buffers_size  32k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Зоны лимитов. Это второй рубеж поверх RateLimitMiddleware в приложении:
    # nginx отсекает флуд до того, как запрос дойдёт до uvicorn и Redis.
    limit_req_zone  $binary_remote_addr zone=api_zone:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status  429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Подключается ИМЕННО наш файл, а не conf.d/*.conf: в образе лежит
    # default.conf со своим server-блоком на :80, и он бы перехватывал запросы.
    include /etc/nginx/conf.d/bscout.conf;
}
