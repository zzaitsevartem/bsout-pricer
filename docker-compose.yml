services:
  postgres:
    image: postgres:16-alpine
    container_name: bscout-postgres
    environment:
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bscout -d bscout"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bscout-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bscout-backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      DEBUG: ${DEBUG:-false}
      PARSER_FULL_SYNC_ENABLED: ${PARSER_FULL_SYNC_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: bscout-worker
    command: ["celery", "-A", "src.worker", "worker", "--loglevel=info", "--concurrency=1"]
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      DEBUG: ${DEBUG:-false}
      PARSER_FULL_SYNC_ENABLED: ${PARSER_FULL_SYNC_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker inspect ping --timeout=10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  beat:
    build: ./backend
    container_name: bscout-beat
    command: ["celery", "-A", "src.worker", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_started
      worker:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      DEBUG: ${DEBUG:-false}
      PARSER_FULL_SYNC_ENABLED: ${PARSER_FULL_SYNC_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  flower:
    build: ./backend
    container_name: bscout-flower
    command: ["celery", "-A", "src.worker", "flower", "--port=5555", "--loglevel=info"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_started
      worker:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      DEBUG: ${DEBUG:-false}
      PARSER_FULL_SYNC_ENABLED: ${PARSER_FULL_SYNC_ENABLED:-false}
      FLOWER_UNAUTHENTICATED_API: ${FLOWER_UNAUTHENTICATED_API:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5555/', timeout=3).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"
    restart: unless-stopped

volumes:
  pgdata:
