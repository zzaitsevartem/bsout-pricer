services:
  postgres:
    image: postgres:16-alpine
    container_name: bscout-postgres
    environment:
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bscout -d bscout"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bscout-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bscout-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      DEBUG: ${DEBUG:-false}
      PARSER_FULL_SYNC_ENABLED: ${PARSER_FULL_SYNC_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: bscout-worker
    command: ["arq", "src.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bscout
      POSTGRES_USER: bscout
      POSTGRES_PASSWORD: bscout
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      DEBUG: ${DEBUG:-false}
      PARSER_FULL_SYNC_ENABLED: ${PARSER_FULL_SYNC_ENABLED:-false}
    healthcheck:
      test: ["CMD", "arq", "src.worker.WorkerSettings", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
